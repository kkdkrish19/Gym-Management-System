<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="GYMVERSE secure login portal"
    >

    <title>GYMVERSE | Login</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
         LOGIN CONTAINER
         ===================================================== -->

    <main class="auth-page">


        <section class="auth-card">


            <!-- ================= BRAND ================= -->

            <a
                href="index.html"
                class="brand"
            >

                <span class="brand-mark">
                    G
                </span>

                <span>
                    GYMVERSE
                </span>

            </a>


            <!-- ================= HEADING ================= -->

            <p class="kicker">
                SECURE ACCESS
            </p>

            <h1>
                Welcome back.
            </h1>

            <p class="auth-description">
                Enter the GYMVERSE command center
                using your registered account.
            </p>


            <!-- ================= ROLE SELECTION ================= -->

            <div class="role-heading">

                <span>
                    SELECT YOUR ROLE
                </span>

            </div>


            <div class="role-grid">


                <button
                    type="button"
                    class="role-button selected"
                    data-role="Member"
                >

                    <span class="role-icon">
                        ◉
                    </span>

                    <span>
                        Member
                    </span>

                </button>


                <button
                    type="button"
                    class="role-button"
                    data-role="Trainer"
                >

                    <span class="role-icon">
                        ◈
                    </span>

                    <span>
                        Trainer
                    </span>

                </button>


                <button
                    type="button"
                    class="role-button"
                    data-role="Admin"
                >

                    <span class="role-icon">
                        ◆
                    </span>

                    <span>
                        Admin
                    </span>

                </button>


            </div>


            <!-- ================= LOGIN FORM ================= -->

            <form
                id="loginForm"
                class="login-form"
            >


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        EMAIL ADDRESS
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="member@gymverse.demo"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <div class="password-label">

                        <label for="password">
                            PASSWORD
                        </label>

                        <a href="#">
                            Forgot password?
                        </a>

                    </div>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Remember -->

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <!-- Login -->

                <button
                    type="submit"
                    class="btn primary login-button"
                >

                    LOGIN TO GYMVERSE →

                </button>


            </form>


            <!-- ================= DEMO INFORMATION ================= -->

            <div class="demo-box">

                <div class="demo-title">
                    DEMO ACCESS
                </div>

                <p>
                    This college prototype does not
                    require a real account.
                </p>

                <div class="demo-details">

                    <span>
                        Email:
                    </span>

                    <b>
                        demo@gymverse.com
                    </b>

                </div>

                <div class="demo-details">

                    <span>
                        Password:
                    </span>

                    <b>
                        123456
                    </b>

                </div>

            </div>


            <!-- ================= BACK ================= -->

            <a
                href="index.html"
                class="back-link"
            >

                ← Back to GYMVERSE

            </a>


        </section>

    </main>


    <!-- =====================================================
         LOGIN PAGE JAVASCRIPT
         ===================================================== -->

    <script>

        /* =================================================
           ROLE SELECTION
           ================================================= */

        const roleButtons =
            document.querySelectorAll(
                ".role-button"
            );


        let selectedRole = "Member";


        roleButtons.forEach(
            button => {

                button.addEventListener(
                    "click",
                    function () {


                        /* Remove previous selection */

                        roleButtons.forEach(
                            item => {

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                        /* Select current role */

                        button.classList.add(
                            "selected"
                        );


                        selectedRole =
                            button.dataset.role;


                    }
                );

            }
        );


        /* =================================================
           LOGIN FORM
           ================================================= */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value.trim();


                /* Basic validation */

                if (
                    email === "" ||
                    password === ""
                ) {

                    alert(
                        "Please enter your email and password."
                    );

                    return;

                }


                /* Demo login */

                if (
                    email ===
                    "demo@gymverse.com" &&
                    password ===
                    "123456"
                ) {


                    /* Save login information */

                    localStorage.setItem(
                        "gymverseLoggedIn",
                        "true"
                    );


                    localStorage.setItem(
                        "gymverseRole",
                        selectedRole
                    );


                    /* Redirect according to role */

                    if (
                        selectedRole ===
                        "Admin"
                    ) {

                        window.location.href =
                            "admin.html";

                    }

                    else if (
                        selectedRole ===
                        "Trainer"
                    ) {

                        window.location.href =
                            "admin.html";

                    }

                    else {

                        window.location.href =
                            "member.html";

                    }

                }

                else {

                    alert(
                        "Invalid demo credentials.\n\nUse:\nEmail: demo@gymverse.com\nPassword: 123456"
                    );

                }

            }
        );

    </script>


    <!-- =====================================================
         LOGIN PAGE ADDITIONAL CSS
         ===================================================== -->

    <style>

        /* ================= AUTH PAGE ================= */

        .auth-page {

            min-height: 100vh;

            display: grid;

            place-items: center;

            padding: 30px 20px;

        }


        /* ================= LOGIN CARD ================= */

        .auth-card {

            width: min(480px, 100%);

            background:
                linear-gradient(
                    145deg,
                    #151a22,
                    #0e1218
                );

            border: 1px solid var(--line);

            border-radius: 28px;

            padding: 34px;

            box-shadow:
                0 35px 100px
                rgba(0, 0, 0, 0.5);

            position: relative;

            overflow: hidden;

        }


        .auth-card::before {

            content: "";

            position: absolute;

            width: 180px;

            height: 180px;

            border-radius: 50%;

            background:
                rgba(201, 255, 74, 0.04);

            right: -80px;

            top: -80px;

            pointer-events: none;

        }


        /* ================= AUTH BRAND ================= */

        .auth-card .brand {

            display: flex;

            margin-bottom: 50px;

            width: fit-content;

        }


        /* ================= HEADING ================= */

        .auth-card h1 {

            font-size: 46px;

            letter-spacing: -0.06em;

            line-height: 1;

            margin: 12px 0 8px;

        }


        .auth-description {

            color: var(--muted);

            font-size: 12px;

            line-height: 1.7;

        }


        /* ================= ROLE ================= */

        .role-heading {

            margin-top: 30px;

            margin-bottom: 10px;

            color: var(--muted);

            font:
                10px
                "DM Mono",
                monospace;

            letter-spacing: .12em;

        }


        .role-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

        }


        .role-button {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 14px 8px;

            background: #0b0f14;

            color: var(--muted);

            border: 1px solid var(--line);

            border-radius: 13px;

            font-size: 11px;

            transition: .2s;

        }


        .role-button:hover {

            border-color: #45515e;

            color: var(--text);

        }


        .role-button.selected {

            color: var(--lime);

            border-color: var(--lime);

            background:
                rgba(201, 255, 74, .05);

            box-shadow:
                inset 0 0 20px
                rgba(201, 255, 74, .03);

        }


        .role-icon {

            font-size: 21px;

        }


        /* ================= FORM ================= */

        .login-form {

            display: grid;

            gap: 13px;

            margin-top: 24px;

        }


        .form-group {

            display: grid;

            gap: 7px;

        }


        .form-group label,
        .password-label label {

            font:
                10px
                "DM Mono",
                monospace;

            letter-spacing: .08em;

            color: var(--muted);

        }


        .password-label {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .password-label a {

            color: var(--lime);

            font-size: 10px;

        }


        .form-group input {

            width: 100%;

            background: #090c11;

            border: 1px solid var(--line);

            color: var(--text);

            padding: 13px;

            border-radius: 12px;

            outline: none;

        }


        .form-group input:focus {

            border-color: var(--lime);

            box-shadow:
                0 0 0 3px
                rgba(201, 255, 74, .04);

        }


        .remember {

            display: flex;

            align-items: center;

            gap: 8px;

            color: var(--muted);

            font-size: 11px;

            margin: 3px 0;

        }


        .remember input {

            accent-color: var(--lime);

        }


        .login-button {

            width: 100%;

            margin-top: 5px;

        }


        /* ================= DEMO BOX ================= */

        .demo-box {

            margin-top: 22px;

            padding: 16px;

            background:
                rgba(201, 255, 74, .025);

            border: 1px dashed #35442b;

            border-radius: 15px;

        }


        .demo-title {

            color: var(--lime);

            font:
                9px
                "DM Mono",
                monospace;

            letter-spacing: .12em;

            margin-bottom: 7px;

        }


        .demo-box p {

            color: var(--muted);

            font-size: 10px;

            margin-bottom: 10px;

        }


        .demo-details {

            display: flex;

            justify-content: space-between;

            gap: 10px;

            font-size: 10px;

            margin-top: 5px;

        }


        .demo-details span {

            color: var(--muted);

        }


        .demo-details b {

            color: var(--text);

            font-weight: 500;

        }


        /* ================= BACK LINK ================= */

        .back-link {

            display: block;

            text-align: center;

            color: var(--muted);

            font-size: 11px;

            margin-top: 22px;

            transition: .2s;

        }


        .back-link:hover {

            color: var(--lime);

        }


        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            .auth-card {

                padding: 25px 20px;

                border-radius: 22px;

            }


            .auth-card h1 {

                font-size: 38px;

            }


            .role-grid {

                grid-template-columns: 1fr;

            }


            .role-button {

                flex-direction: row;

                justify-content: flex-start;

            }

        }

    </style>

</body>

</html>
